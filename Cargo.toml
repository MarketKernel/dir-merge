[package]
name = "dir-merge"
version = "0.1.0"
edition = "2024"

[dependencies]
chardetng = "1.0.0"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui_extras = "0.35"
encoding_rs = "0.8.42"
globset = "0.4.20"
imara-diff = "0.2"
memchr = "2.8.3"
memmap2 = "0.9.11"
parking_lot = "0.12.5"
png = { version = "0.18.1", optional = true }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
trash = "5.2.9"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[features]
# Scripted UI driver used for automated screenshots (DIRMERGE_SCRIPT env var).
autotest = ["dep:png"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
